name: Daily NAV Alert
on:
  schedule:
    - cron: '0 13 * * 1-5'
  workflow_dispatch:
jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/alert.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          # AR-3: Supabase signal history persistence. Add these secrets in GitHub repo settings.
          # SUPABASE_URL: project URL (e.g. https://xyz.supabase.co) — NOT the VITE_ prefixed one
          # SUPABASE_SERVICE_KEY: service role key (bypasses RLS) — different from anon key
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
